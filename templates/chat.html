<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healin - AI Medical Assistant</title>
    
    <!-- Bootstrap and Fonts -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css')}}"/>
</head>
<body>
    <div class="container-fluid h-100">
        <div class="row justify-content-center h-100">      
            <div class="col-md-9 col-lg-7 col-xl-6 chat">
                <div class="card">
                    <div class="card-header msg_head">
                        <div class="d-flex bd-highlight">
                            <div class="img_cont">
                                <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img" alt="Healin Avatar">
                                <span class="online_icon"></span>
                            </div>
                            <div class="user_info">
                                <span>Healin</span>
                                <p>AI Medical Assistant</p>
                            </div>
                        </div>
                    </div>
                    
                    <div id="messageFormeight" class="card-body msg_card_body">
                        <!-- Initial Greeting -->
                        <div class="d-flex justify-content-start mb-4">
                            <div class="img_cont_msg">
                                <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img_msg" alt="Healin">
                            </div>
                            <div class="msg_cotainer">
                                Hello! I am Healin, your personal medical assistant. How can I help you today?
                                <span class="msg_time">Just now</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card-footer">
                        <form id="messageArea" class="input-group">
                            <input type="text" id="text" name="msg" placeholder="Ask a medical question..." autocomplete="off" class="form-control type_msg" required/>
                            <div class="input-group-append">
                                <button type="submit" id="send" class="input-group-text send_btn" aria-label="Send Message">
                                    <i class="fas fa-paper-plane"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function scrollToBottom() {
            var msgBody = document.getElementById("messageFormeight");
            msgBody.scrollTop = msgBody.scrollHeight;
        }

        $(document).ready(function() {
            scrollToBottom(); // Scroll on initial load
            
            $("#messageArea").on("submit", async function(event) {
                event.preventDefault();

                const date = new Date();
                const str_time = date.getHours().toString().padStart(2, '0') + ":" + date.getMinutes().toString().padStart(2, '0');
                
                var rawText = $("#text").val();
                if (!rawText.trim()) return;

                var userHtml = `
                <div class="d-flex justify-content-end mb-4">
                    <div class="msg_cotainer_send">
                        ${rawText.replace(/</g, "&lt;").replace(/>/g, "&gt;")}
                        <span class="msg_time_send">${str_time}</span>
                    </div>
                </div>`;
                
                $("#text").val("");
                $("#messageFormeight").append(userHtml);
                scrollToBottom();

                const botId = "bot-msg-" + Date.now();
                var botHtml = `
                <div class="d-flex justify-content-start mb-4">
                    <div class="img_cont_msg">
                        <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img_msg">
                    </div>
                    <div class="msg_cotainer" id="${botId}">
                        <div class="typing">
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                        </div>
                    </div>
                </div>`;
                $("#messageFormeight").append(botHtml);
                scrollToBottom();

                try {
                    const response = await fetch('/get', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({ 'msg': rawText })
                    });

                    if (!response.ok) throw new Error("Network response was not ok");

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder("utf-8");
                    let fullText = "";
                    
                    document.getElementById(botId).innerHTML = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        
                        const chunk = decoder.decode(value, { stream: true });
                        fullText += chunk;
                        
                        document.getElementById(botId).innerHTML = marked.parse(fullText) + `<span class="msg_time">${str_time}</span>`;
                        scrollToBottom();
                    }
                } catch (error) {
                    console.error("Fetch error:", error);
                    document.getElementById(botId).innerHTML = `Sorry, I encountered an error. Please try connecting again. <span class="msg_time">${str_time}</span>`;
                    scrollToBottom();
                }
            });
        });
    </script>
</body>
</html>
